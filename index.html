<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dokiyolo@MacBookPro:~</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Menlo&family=SF+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1d2021;
    --terminal-bg: #1a1e24;
    --titlebar-bg: #2c2f38;
    --text: #c5c8c6;
    --text-dim: #6b7089;
    --green: #a6e22e;
    --blue: #56b6c2;
    --cyan: #56d4dd;
    --yellow: #e5c07b;
    --orange: #d19a66;
    --red: #e06c75;
    --magenta: #c678dd;
    --white: #dcdfe4;
    --prompt-user: #c5c8c6;
    --prompt-arrow-bg: #3d8fd1;
    --prompt-arrow-fg: #fff;
    --cursor-color: #e8913a;
    --dot-red: #ff5f57;
    --dot-yellow: #febc2e;
    --dot-green: #28c840;
    --selection: rgba(86, 182, 194, 0.25);
  }

  body {
    background: #1a1a2e;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(72, 49, 157, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(29, 78, 137, 0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(20, 20, 50, 0.5) 0%, transparent 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Menlo', 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono',
                 'Droid Sans Mono', 'Source Code Pro', monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }

  ::selection {
    background: var(--selection);
  }

  /* ===== Desktop Area ===== */
  .desktop {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ===== Terminal Window ===== */
  .terminal-wrapper {
    width: 90vw;
    max-width: 860px;
    height: 80vh;
    max-height: 580px;
    display: flex;
    flex-direction: column;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.3),
      0 22px 70px 4px rgba(0,0,0,0.56),
      0 0 80px rgba(0,0,0,0.3);
    animation: windowAppear 0.5s ease-out;
    transition: opacity 0.4s cubic-bezier(.4,0,.2,1),
                width 0.35s cubic-bezier(.4,0,.2,1),
                height 0.35s cubic-bezier(.4,0,.2,1),
                max-width 0.35s cubic-bezier(.4,0,.2,1),
                max-height 0.35s cubic-bezier(.4,0,.2,1),
                border-radius 0.35s cubic-bezier(.4,0,.2,1);
    position: absolute;
    z-index: 10;
  }

  .terminal-wrapper.dragging {
    transition: none;
    user-select: none;
  }

  .terminal-wrapper.maximized {
    width: 100vw !important;
    max-width: 100vw !important;
    height: 100vh !important;
    max-height: 100vh !important;
    border-radius: 0 !important;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }

  .terminal-wrapper.minimizing {
    transform: scale(0.15) translateY(80vh) !important;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.4s cubic-bezier(.4,0,.2,1) !important;
  }

  .terminal-wrapper.minimized {
    transform: scale(0.15) translateY(80vh) !important;
    opacity: 0;
    pointer-events: none;
    display: none;
  }

  .terminal-wrapper.closing {
    transform: scale(0.8) !important;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.4s cubic-bezier(.4,0,.2,1) !important;
  }

  .terminal-wrapper.closed {
    display: none;
  }

  @keyframes windowAppear {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes windowRestore {
    from { transform: scale(0.15) translateY(80vh); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  .titlebar {
    background: var(--titlebar-bg);
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    position: relative;
    border-bottom: 1px solid rgba(0,0,0,0.3);
    flex-shrink: 0;
    cursor: grab;
  }

  .titlebar:active {
    cursor: grabbing;
  }

  .titlebar-dots {
    display: flex;
    gap: 8px;
    z-index: 1;
  }

  .titlebar-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    transition: opacity 0.15s;
  }

  .titlebar-dot.red { background: var(--dot-red); }
  .titlebar-dot.yellow { background: var(--dot-yellow); }
  .titlebar-dot.green { background: var(--dot-green); }

  .titlebar-dot:hover { opacity: 0.8; }

  .titlebar-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    display: none;
  }

  .titlebar:hover .titlebar-dot.red::after {
    content: '×';
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
    line-height: 1;
  }

  .titlebar:hover .titlebar-dot.yellow::after {
    content: '−';
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
    line-height: 1;
  }

  .titlebar:hover .titlebar-dot.green::after {
    content: '+';
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
    line-height: 1;
  }

  .titlebar-shortcut {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 14px;
  }

  .titlebar-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .terminal-body {
    background: var(--terminal-bg);
    flex: 1;
    padding: 12px 16px;
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    cursor: text;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .terminal-body::-webkit-scrollbar { width: 6px; }
  .terminal-body::-webkit-scrollbar-track { background: transparent; }
  .terminal-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
  }

  .output-line {
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 1.55em;
  }

  .prompt-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
  }

  .prompt-user { color: var(--prompt-user); }

  .prompt-separator {
    display: inline-flex;
    align-items: center;
    margin-left: 2px;
    position: relative;
  }

  .prompt-dir-wrapper {
    display: inline-flex;
    align-items: center;
    position: relative;
    height: 20px;
  }

  .prompt-dir-bg {
    background: var(--prompt-arrow-bg);
    color: var(--prompt-arrow-fg);
    padding: 0 8px;
    font-size: 13px;
    font-weight: 600;
    height: 20px;
    line-height: 20px;
    display: inline-block;
    position: relative;
  }

  .prompt-dir-arrow {
    width: 0; height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 10px solid var(--prompt-arrow-bg);
    display: inline-block;
    vertical-align: middle;
  }

  .input-area {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    flex: 1;
    position: relative;
  }

  .input-mirror {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  #command-input {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: transparent;
    font-family: inherit;
    font-size: inherit;
    caret-color: transparent;
    z-index: 2;
  }

  .input-display {
    color: var(--text);
    white-space: pre;
    pointer-events: none;
    min-height: 1.55em;
  }

  .cursor-blink {
    display: inline-block;
    width: 8px; height: 17px;
    background: var(--cursor-color);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    flex-shrink: 0;
    position: relative;
    top: 1px;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .color-green { color: var(--green); }
  .color-blue { color: var(--blue); }
  .color-cyan { color: var(--cyan); }
  .color-yellow { color: var(--yellow); }
  .color-orange { color: var(--orange); }
  .color-red { color: var(--red); }
  .color-magenta { color: var(--magenta); }
  .color-white { color: var(--white); }
  .color-dim { color: var(--text-dim); }
  .bold { font-weight: bold; }
  .underline { text-decoration: underline; }

  .ascii-art {
    color: var(--cyan);
    line-height: 1.2;
    font-size: 12px;
  }

  .link {
    color: var(--blue);
    text-decoration: underline;
    cursor: pointer;
  }
  .link:hover { color: var(--cyan); }

  /* ===== Dock ===== */
  .dock-wrapper {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    padding: 0 4px;
  }

  .dock {
    display: flex;
    align-items: flex-end;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 4px 10px 6px 10px;
    min-height: 68px;
  }

  .dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    position: relative;
    margin: 0 6px;
  }

  .dock-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    transform-origin: center bottom;
    will-change: transform;
    transition: transform 0.15s ease-out;
    user-select: none;
  }

  .dock-tooltip {
    position: absolute;
    top: -36px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    background: rgba(40,40,50,0.92);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 4px 12px;
    border-radius: 5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s, transform 0.12s;
  }

  .dock-item.hovered .dock-tooltip {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .dock-indicator {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    margin-top: 3px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .dock-item.active .dock-indicator {
    opacity: 1;
  }

  .dock-separator {
    width: 1px;
    height: 36px;
    background: rgba(255,255,255,0.15);
    margin: 0 10px;
    align-self: center;
    flex-shrink: 0;
  }

  @keyframes dockBounce {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-20px); }
    50% { transform: translateY(0); }
    75% { transform: translateY(-10px); }
  }

  @media (max-width: 640px) {
    .terminal-wrapper {
      width: 100vw;
      height: calc(100vh - 72px);
      max-width: none;
      max-height: none;
      border-radius: 0;
    }
    .terminal-body { font-size: 12px; padding: 8px 10px; }
    .titlebar { height: 34px; }
    .dock-icon { width: 40px; height: 40px; font-size: 22px; border-radius: 10px; }
    .dock { height: 54px; border-radius: 14px; }
  }
</style>
</head>
<body>

<script>
const input = document.getElementById('command-input');
const output = document.getElementById('output');
const terminal = document.getElementById('terminal');
const cursor = document.getElementById('cursor');
const promptDir = document.getElementById('prompt-dir');
const inputDisplay = document.getElementById('input-display');
const terminalWrapper = document.getElementById('terminal-wrapper');
const btnClose = document.getElementById('btn-close');
const btnMinimize = document.getElementById('btn-minimize');
const btnMaximize = document.getElementById('btn-maximize');
const dockTerminal = document.getElementById('dock-terminal');

function syncInputDisplay() {
  inputDisplay.textContent = input.value;
}

input.addEventListener('input', syncInputDisplay);

let commandHistory = [];
let historyIndex = -1;
let currentDir = '~';
let isMaximized = false;
let isMinimized = false;
let isClosed = false;

/* ===== Window Dragging ===== */
const titlebar = document.getElementById('titlebar');
const desktop = document.getElementById('desktop');
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

function centerWindow() {
  const rect = terminalWrapper.getBoundingClientRect();
  const parentRect = desktop.getBoundingClientRect();
  terminalWrapper.style.left = (parentRect.width - rect.width) / 2 + 'px';
  terminalWrapper.style.top = (parentRect.height - rect.height) / 2 + 'px';
}

centerWindow();
window.addEventListener('resize', () => {
  if (!isDragging && !isMaximized) centerWindow();
});

titlebar.addEventListener('mousedown', (e) => {
  if (e.target.classList.contains('titlebar-dot') || isMaximized) return;
  isDragging = true;
  terminalWrapper.classList.add('dragging');
  const rect = terminalWrapper.getBoundingClientRect();
  const parentRect = desktop.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left + parentRect.left;
  dragOffsetY = e.clientY - rect.top + parentRect.top;
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const parentRect = desktop.getBoundingClientRect();
  let newX = e.clientX - dragOffsetX;
  let newY = e.clientY - dragOffsetY;
  const maxX = parentRect.width - terminalWrapper.offsetWidth;
  const maxY = parentRect.height - terminalWrapper.offsetHeight;
  newX = Math.max(-terminalWrapper.offsetWidth * 0.5, Math.min(newX, maxX + terminalWrapper.offsetWidth * 0.5));
  newY = Math.max(0, Math.min(newY, maxY + 40));
  terminalWrapper.style.left = newX + 'px';
  terminalWrapper.style.top = newY + 'px';
});

document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    terminalWrapper.classList.remove('dragging');
  }
});

/* ===== Window Controls ===== */
btnClose.addEventListener('click', () => {
  terminalWrapper.classList.add('closing');
  isClosed = true;
  setTimeout(() => {
    terminalWrapper.classList.remove('closing');
    terminalWrapper.classList.add('closed');
    dockTerminal.classList.remove('active');
  }, 400);
});

btnMinimize.addEventListener('click', () => {
  terminalWrapper.classList.add('minimizing');
  isMinimized = true;
  setTimeout(() => {
    terminalWrapper.classList.remove('minimizing');
    terminalWrapper.classList.add('minimized');
  }, 400);
});

btnMaximize.addEventListener('click', () => {
  if (isMaximized) {
    terminalWrapper.classList.remove('maximized');
    isMaximized = false;
    setTimeout(centerWindow, 10);
  } else {
    terminalWrapper.classList.add('maximized');
    isMaximized = true;
  }
  input.focus();
});

dockTerminal.addEventListener('click', () => {
  if (isClosed) {
    centerWindow();
    terminalWrapper.classList.remove('closed');
    terminalWrapper.style.animation = 'windowAppear 0.4s ease-out';
    isClosed = false;
    dockTerminal.classList.add('active');
    setTimeout(() => { terminalWrapper.style.animation = ''; }, 400);
    input.focus();
    return;
  }
  if (isMinimized) {
    centerWindow();
    terminalWrapper.classList.remove('minimized');
    terminalWrapper.style.animation = 'windowRestore 0.4s cubic-bezier(.34,1.56,.64,1)';
    isMinimized = false;
    setTimeout(() => { terminalWrapper.style.animation = ''; }, 400);
    input.focus();
    return;
  }
});

document.querySelectorAll('.dock-item').forEach(item => {
  item.addEventListener('click', () => {
    const app = item.dataset.app;

    if (app === 'github') {
      window.open('https://github.com/DokiYoloo', '_blank');
      return;
    }

    if (app !== 'terminal') {
      item.querySelector('.dock-icon').style.animation = 'dockBounce 0.6s cubic-bezier(.34,1.56,.64,1)';
      setTimeout(() => {
        item.querySelector('.dock-icon').style.animation = '';
      }, 600);
    }
  });
});

/* ===== Dock Magnification (Gaussian) ===== */
const dock = document.getElementById('dock');
const dockItems = dock.querySelectorAll('.dock-item');
const BASE_SIZE = 50;
const MAX_SCALE = 1.5;
const AFFECT_DISTANCE = 130;

function updateDockMagnification(mouseX) {
  dockItems.forEach(item => {
    const icon = item.querySelector('.dock-icon');
    const rect = item.getBoundingClientRect();
    const itemCenterX = rect.left + rect.width / 2;
    const dist = Math.abs(mouseX - itemCenterX);

    if (dist < AFFECT_DISTANCE) {
      const ratio = 1 - (dist / AFFECT_DISTANCE);
      const scale = 1 + (MAX_SCALE - 1) * Math.cos((1 - ratio) * Math.PI / 2);
      const translateY = -(scale - 1) * BASE_SIZE * 0.5;
      icon.style.transform = `scale(${scale}) translateY(${translateY}px)`;
      icon.style.transition = 'transform 0.08s ease-out';
    } else {
      icon.style.transform = 'scale(1) translateY(0)';
      icon.style.transition = 'transform 0.15s ease-out';
    }

    if (dist < rect.width / 2) {
      item.classList.add('hovered');
    } else {
      item.classList.remove('hovered');
    }
  });
}

function resetDockMagnification() {
  dockItems.forEach(item => {
    const icon = item.querySelector('.dock-icon');
    icon.style.transform = 'scale(1) translateY(0)';
    icon.style.transition = 'transform 0.2s ease-out';
    item.classList.remove('hovered');
  });
}

dock.addEventListener('mousemove', (e) => {
  updateDockMagnification(e.clientX);
});

dock.addEventListener('mouseleave', () => {
  resetDockMagnification();
});

/* ===== Terminal Logic ===== */
const ASCII_LOGO = `
  ██████╗  ██████╗ ██╗  ██╗██╗██╗   ██╗ ██████╗ ██╗      ██████╗
  ██╔══██╗██╔═══██╗██║ ██╔╝██║╚██╗ ██╔╝██╔═══██╗██║     ██╔═══██╗
  ██║  ██║██║   ██║█████╔╝ ██║ ╚████╔╝ ██║   ██║██║     ██║   ██║

function printLines(lines, animate = false) {
  if (!animate) {
    lines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'output-line';
      div.innerHTML = line;
      output.appendChild(div);
    });
    scrollToBottom();
    return Promise.resolve();
  }

  return new Promise(resolve => {
    let i = 0;
    function next() {
      if (i >= lines.length) { resolve(); return; }
      const div = document.createElement('div');
      div.className = 'output-line';
      div.innerHTML = lines[i];
      output.appendChild(div);
      scrollToBottom();
      i++;
      setTimeout(next, 25);
    }
    next();
  });
}

function printPrompt(cmd) {
  const div = document.createElement('div');
  div.className = 'output-line prompt-line';
  div.innerHTML = `<span class="prompt-user">dokiyolo@MacBookPro</span><span class="prompt-separator"><span class="prompt-dir-wrapper"><span class="prompt-dir-bg">${currentDir}</span><span class="prompt-dir-arrow"></span></span></span><span class="input-area" style="margin-left:6px">${escapeHtml(cmd)}</span>`;
  output.appendChild(div);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  terminal.scrollTop = terminal.scrollHeight;
}

function processCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  commandHistory.push(trimmed);
  historyIndex = commandHistory.length;

  printPrompt(trimmed);

  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch(cmd) {
    case 'help':
      printLines(HELP_TEXT);
      break;
    case 'about':
      printLines(FILE_CONTENTS['about.txt'], true);
      break;
    case 'skills':
      printLines(FILE_CONTENTS['skills.txt'], true);
      break;
    case 'projects':
      printLines([
        '',
        ...FILE_CONTENTS['project-1.md'],
      ], true);
      break;
    case 'experience':
      printLines(FILE_CONTENTS['experience.txt'], true);
      break;
    case 'contact':
      printLines(FILE_CONTENTS['contact.txt'], true);
      break;
    case 'clear':
      output.innerHTML = '';
      break;
    case 'ls': {
      const dir = currentDir;
      const files = FILE_SYSTEM[dir];
      if (files) {
        const formatted = files.map(f => {
          if (f.endsWith('/')) return `<span class="color-blue bold">${f}</span>`;
          if (f.endsWith('.md')) return `<span class="color-green">${f}</span>`;
          return `<span class="color-white">${f}</span>`;
        });
        printLines(['', '  ' + formatted.join('    '), '']);
      } else {
        printLines([`ls: cannot access '${dir}': 目录为空`]);
      }
      break;
    }
    case 'cd': {
      const target = (args[0] || '').replace(/\/+$/, '');
      if (!target || target === '~' || target === '') {
        currentDir = '~';
      } else if (target === '..' || target === '../') {
        if (currentDir !== '~') {
          const parts = currentDir.split('/');
          parts.pop();
          currentDir = parts.join('/') || '~';
        }
      } else if (target === 'projects' || target === '~/projects' || target === './projects') {
        currentDir = '~/projects';
      } else {
        printLines([`<span class="color-red">cd: no such file or directory: ${escapeHtml(target)}</span>`]);
        break;
      }
      promptDir.textContent = currentDir;
      break;
    }
    case 'pwd':
      printLines([`/Users/dokiyolo${currentDir === '~' ? '' : currentDir.replace('~', '')}`]);
      break;
    case 'cat': {
      const filename = args[0];
      if (!filename) {
        printLines([`<span class="color-red">cat: 请指定文件名。用法: cat &lt;filename&gt;</span>`]);
        break;
      }
      let resolved = filename;
      if (currentDir === '~/projects' && !filename.includes('/')) {
        resolved = filename;
      }
      if (FILE_CONTENTS[resolved]) {
        printLines(FILE_CONTENTS[resolved], true);
      } else {
        printLines([`<span class="color-red">cat: ${escapeHtml(filename)}: No such file or directory</span>`]);
      }
      break;
    }
    case 'whoami':
      printLines(['dokiyolo']);
      break;
    case 'date':
      printLines([new Date().toString()]);
      break;
    case 'echo':
      printLines([args.join(' ')]);
      break;
    case 'history':
      printLines(['', ...commandHistory.map((c, i) =>
        `  <span class="color-dim">${String(i + 1).padStart(4)}</span>  ${escapeHtml(c)}`
      ), '']);
      break;
    case 'neofetch':
      printLines(NEOFETCH, true);
      break;
    case 'buy':
      printLines([
        '',
        '<span class="color-cyan bold">  ╔══════════════════════════════════════╗</span>',
        '<span class="color-cyan bold">  ║       购买此域名 / Buy Domain       ║</span>',
        '<span class="color-cyan bold">  ╚══════════════════════════════════════╝</span>',
        '',
        '  <span class="color-yellow">💰 售价:</span>     <span class="color-green bold">¥50,000 RMB</span>',
        '  <span class="color-yellow">💬 QQ:</span>       <span class="color-white bold">857815116</span>',
        '',
        '  <span class="color-dim">如有意购买，请通过 QQ 联系我，备注「域名购买」</span>',
        '',
      ], true);
      break;
    case 'sudo':
      printLines([
        '',
        '<span class="color-red">  ⚠ Permission denied: 不好意思，这里没有 root 权限 😄</span>',
        '',
      ]);
      break;
    case 'rm':
      printLines([
        '',
        '<span class="color-red">  ⚠ 危险操作已拦截！这可不是真正的终端哦~</span>',
        '',
      ]);
      break;
    case 'vim':
    case 'vi':
    case 'nano':
      printLines([
        '',
        `<span class="color-yellow">  目前不支持 nano 编辑器哦 :)</span>`,
        '',
      ]);
      break;
    case 'exit':
      printLines([
        '',
        '<span class="color-dim">  再见！感谢你的访问~ 👋</span>',
        '',
      ]);
      setTimeout(() => {
        terminalWrapper.classList.add('closing');
        isClosed = true;
        setTimeout(() => {
          terminalWrapper.classList.remove('closing');
          terminalWrapper.classList.add('closed');
          dockTerminal.classList.remove('active');
        }, 400);
      }, 600);
      break;
    default:
      printLines([`<span class="color-red">zsh: command not found: ${escapeHtml(cmd)}</span>`,
                   `<span class="color-dim">输入 <span class="color-yellow">help</span> 查看可用命令</span>`]);
  }

  scrollToBottom();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    syncInputDisplay();
    processCommand(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = commandHistory[historyIndex] || '';
      syncInputDisplay();
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      input.value = commandHistory[historyIndex] || '';
    } else {
      historyIndex = commandHistory.length;
      input.value = '';
    }
    syncInputDisplay();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;

    const parts = val.split(/\s+/);
    const lastPart = parts[parts.length - 1];

    if (parts.length === 1) {
      const matches = AVAILABLE_COMMANDS.filter(c => c.startsWith(lastPart));
      if (matches.length === 1) {
        input.value = matches[0];
        syncInputDisplay();
      } else if (matches.length > 1) {
        printPrompt(val);
        printLines(['  ' + matches.map(m => `<span class="color-yellow">${m}</span>`).join('    ')]);
      }
    } else if (parts[0] === 'cat' || parts[0] === 'cd') {
      const dir = currentDir;
      const files = FILE_SYSTEM[dir] || [];
      const matches = files.filter(f => f.replace('/', '').startsWith(lastPart));
      if (matches.length === 1) {
        parts[parts.length - 1] = matches[0].replace('/', '');
        input.value = parts.join(' ');
        syncInputDisplay();
      } else if (matches.length > 1) {
        printPrompt(val);
        printLines(['  ' + matches.map(f =>
          f.endsWith('/') ? `<span class="color-blue bold">${f}</span>` : `<span class="color-white">${f}</span>`
        ).join('    ')]);
      }
    }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    output.innerHTML = '';
  }
});

  input.focus();
