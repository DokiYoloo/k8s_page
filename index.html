  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1d2021;
    --terminal-bg: #1a1e24;

  body {
    background: var(--bg);

    width: 90vw;

    height: 85vh;

    display: flex;
    flex-direction: column;
    border-radius: 10px;
    overflow: hidden;

    animation: windowAppear 0.5s ease-out;
  }

  @keyframes windowAppear {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .titlebar {
    background: var(--titlebar-bg);
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    position: relative;
    -webkit-app-region: drag;
    border-bottom: 1px solid rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .titlebar-dots {
    display: flex;
    gap: 8px;
    z-index: 1;
  }

  .titlebar-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    transition: opacity 0.15s;
  }

  .titlebar-dot.red { background: var(--dot-red); }
  .titlebar-dot.yellow { background: var(--dot-yellow); }
  .titlebar-dot.green { background: var(--dot-green); }

  .titlebar-dot:hover { opacity: 0.8; }

  .titlebar-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    display: none;
  }

  .titlebar:hover .titlebar-dot.red::after {
    content: '×';
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
    line-height: 1;
  }

  .titlebar:hover .titlebar-dot.yellow::after {
    content: '−';
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
    line-height: 1;
  }

  .titlebar:hover .titlebar-dot.green::after {
    content: '+';
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: rgba(0,0,0,0.6);
    line-height: 1;
  }

  .titlebar-shortcut {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 14px;
  }

  .titlebar-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .terminal-body {
    background: var(--terminal-bg);
    flex: 1;
    padding: 12px 16px;
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    cursor: text;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  .terminal-body::-webkit-scrollbar {
    width: 6px;
  }

  .terminal-body::-webkit-scrollbar-track {
    background: transparent;
  }

  .terminal-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
  }

  .output-line {
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 1.55em;
  }

  .prompt-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
  }

  .prompt-user {
    color: var(--prompt-user);
  }

  .prompt-separator {
    display: inline-flex;
    align-items: center;
    margin-left: 2px;
    position: relative;
  }

  .prompt-dir-wrapper {
    display: inline-flex;
    align-items: center;
    position: relative;
    height: 20px;
  }

  .prompt-dir-bg {
    background: var(--prompt-arrow-bg);
    color: var(--prompt-arrow-fg);
    padding: 0 8px 0 8px;
    font-size: 13px;
    font-weight: 600;
    height: 20px;
    line-height: 20px;
    display: inline-block;
    position: relative;
  }

  .prompt-dir-arrow {
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 10px solid var(--prompt-arrow-bg);
    display: inline-block;
    vertical-align: middle;
  }

  .input-area {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    flex: 1;
    position: relative;
  }

  .input-mirror {
    position: relative;
    display: inline-flex;
    align-items: center;
  }

  #command-input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: transparent;
    font-family: inherit;
    font-size: inherit;
    caret-color: transparent;
    z-index: 2;
  }

  .input-display {
    color: var(--text);
    white-space: pre;
    pointer-events: none;
    min-height: 1.55em;
  }

  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 17px;
    background: var(--cursor-color);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    flex-shrink: 0;
    position: relative;
    top: 1px;
  }

    50% { opacity: 0; }

  .color-cyan { color: var(--cyan); }

  .underline { text-decoration: underline; }

    line-height: 1.2;

    gap: 4px;

  .table-key {
    color: var(--yellow);

function printLines(lines, animate = false) {
  if (!animate) {
    lines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'output-line';
      div.innerHTML = line;
      output.appendChild(div);
    });
    scrollToBottom();
    return Promise.resolve();
  }

  return new Promise(resolve => {
    let i = 0;
    function next() {
      if (i >= lines.length) { resolve(); return; }
      const div = document.createElement('div');
      div.className = 'output-line';
      div.innerHTML = lines[i];
      output.appendChild(div);
      scrollToBottom();
      i++;
      setTimeout(next, 25);
    }
    next();
  });
}

function printPrompt(cmd) {
  const div = document.createElement('div');
  div.className = 'output-line prompt-line';
  div.innerHTML = `<span class="prompt-user">dokiyolo@MacBookPro</span><span class="prompt-separator"><span class="prompt-dir-wrapper"><span class="prompt-dir-bg">${currentDir}</span><span class="prompt-dir-arrow"></span></span></span><span class="input-area" style="margin-left:6px">${escapeHtml(cmd)}</span>`;
  output.appendChild(div);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  terminal.scrollTop = terminal.scrollHeight;
}

function processCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  commandHistory.push(trimmed);
  historyIndex = commandHistory.length;

  printPrompt(trimmed);

  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch(cmd) {
    case 'help':
      printLines(HELP_TEXT);
      break;
    case 'about':
      printLines(FILE_CONTENTS['about.txt'], true);
      break;
    case 'skills':
      printLines(FILE_CONTENTS['skills.txt'], true);
      break;
    case 'projects':
      printLines([
        '',
        ...FILE_CONTENTS['project-1.md'],
      ], true);
      break;
    case 'experience':
      printLines(FILE_CONTENTS['experience.txt'], true);
      break;
    case 'contact':
      printLines(FILE_CONTENTS['contact.txt'], true);
      break;
    case 'clear':
      output.innerHTML = '';
      break;
    case 'ls': {
      const dir = currentDir;
      const files = FILE_SYSTEM[dir];
      if (files) {
        const formatted = files.map(f => {
          if (f.endsWith('/')) return `<span class="color-blue bold">${f}</span>`;
          if (f.endsWith('.md')) return `<span class="color-green">${f}</span>`;
          return `<span class="color-white">${f}</span>`;
        });
        printLines(['', '  ' + formatted.join('    '), '']);
      } else {
        printLines([`ls: cannot access '${dir}': 目录为空`]);
      }
      break;
    }
    case 'cd': {
      const target = (args[0] || '').replace(/\/+$/, '');
      if (!target || target === '~' || target === '') {
        currentDir = '~';
      } else if (target === '..' || target === '../') {
        if (currentDir !== '~') {
          const parts = currentDir.split('/');
          parts.pop();
          currentDir = parts.join('/') || '~';
        }
      } else if (target === 'projects' || target === '~/projects' || target === './projects') {
        currentDir = '~/projects';
      } else {
        printLines([`<span class="color-red">cd: no such file or directory: ${escapeHtml(target)}</span>`]);
        break;
      }
      promptDir.textContent = currentDir;
      break;
    }
    case 'pwd':
      printLines([`/Users/dokiyolo${currentDir === '~' ? '' : currentDir.replace('~', '')}`]);
      break;
    case 'cat': {
      const filename = args[0];
      if (!filename) {
        printLines([`<span class="color-red">cat: 请指定文件名。用法: cat &lt;filename&gt;</span>`]);
        break;
      }
      let resolved = filename;
      if (currentDir === '~/projects' && !filename.includes('/')) {
        resolved = filename;
      }
      if (FILE_CONTENTS[resolved]) {
        printLines(FILE_CONTENTS[resolved], true);
      } else {
        printLines([`<span class="color-red">cat: ${escapeHtml(filename)}: No such file or directory</span>`]);
      }
      break;
    }
    case 'whoami':
      printLines(['dokiyolo']);
      break;
    case 'date':
      printLines([new Date().toString()]);
      break;
    case 'echo':
      printLines([args.join(' ')]);
      break;
    case 'history':
      printLines(['', ...commandHistory.map((c, i) =>
        `  <span class="color-dim">${String(i + 1).padStart(4)}</span>  ${escapeHtml(c)}`
      ), '']);
      break;
    case 'neofetch':
      printLines(NEOFETCH, true);
      break;
    case 'sudo':
      printLines([
        '',
        '<span class="color-red">  ⚠ Permission denied: 不好意思，这里没有 root 权限 😄</span>',
        '',
      ]);
      break;
    case 'rm':
      printLines([
        '',
        '<span class="color-red">  ⚠ 危险操作已拦截！这可不是真正的终端哦~</span>',
        '',
      ]);
      break;
    case 'vim':
    case 'vi':
    case 'nano':
      printLines([
        '',
        `<span class="color-yellow">  目前不支持 nano 编辑器哦 :)</span>`,
        '',
      ]);
      break;
    case 'exit':
      printLines([
        '',
        '<span class="color-dim">  再见！感谢你的访问~ 👋</span>',
        '',
      ]);
      setTimeout(() => {
        document.querySelector('.terminal-wrapper').style.transition = 'all 0.4s ease';
        document.querySelector('.terminal-wrapper').style.transform = 'scale(0.9)';
        document.querySelector('.terminal-wrapper').style.opacity = '0';
      }, 600);
      break;
    default:
      printLines([`<span class="color-red">zsh: command not found: ${escapeHtml(cmd)}</span>`,
                   `<span class="color-dim">输入 <span class="color-yellow">help</span> 查看可用命令</span>`]);
  }

  scrollToBottom();
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    syncInputDisplay();
    processCommand(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = commandHistory[historyIndex] || '';
      syncInputDisplay();
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < commandHistory.length - 1) {
      historyIndex++;
      input.value = commandHistory[historyIndex] || '';
    } else {
      historyIndex = commandHistory.length;
      input.value = '';
    }
    syncInputDisplay();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.trim();
    if (!val) return;

    const parts = val.split(/\s+/);
    const lastPart = parts[parts.length - 1];

    if (parts.length === 1) {
      const matches = AVAILABLE_COMMANDS.filter(c => c.startsWith(lastPart));
      if (matches.length === 1) {
        input.value = matches[0];
        syncInputDisplay();
      } else if (matches.length > 1) {
        printPrompt(val);
        printLines(['  ' + matches.map(m => `<span class="color-yellow">${m}</span>`).join('    ')]);
      }
    } else if (parts[0] === 'cat' || parts[0] === 'cd') {
      const dir = currentDir;
      const files = FILE_SYSTEM[dir] || [];
      const matches = files.filter(f => f.replace('/', '').startsWith(lastPart));
      if (matches.length === 1) {
        parts[parts.length - 1] = matches[0].replace('/', '');
        input.value = parts.join(' ');
        syncInputDisplay();
      } else if (matches.length > 1) {
        printPrompt(val);
        printLines(['  ' + matches.map(f =>
          f.endsWith('/') ? `<span class="color-blue bold">${f}</span>` : `<span class="color-white">${f}</span>`
        ).join('    ')]);
      }
    }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    output.innerHTML = '';
  }
});

terminal.addEventListener('click', () => {
  input.focus();
});

document.addEventListener('keydown', () => {
  input.focus();
});

printLines(WELCOME_MSG);
input.focus();
</script>
