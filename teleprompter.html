  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 主题变量 ── */
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #272727;
      --text: #f0f0f0;
      --muted: #666;
      --hint: rgba(255,255,255,0.28);
      --btn-hover: #1e1e1e;
      --btn-hover-border: #444;
      --modal-bg: #161616;
      --accent: #4f8ef7;
      --focus-color: rgba(79,142,247,0.12);
      --dim-color: #777;
      --gradient-fade: var(--bg);
    }

    body.light {
      --bg: #f4f4f4;
      --surface: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --muted: #999;
      --hint: rgba(0,0,0,0.32);
      --btn-hover: #f0f0f0;
      --btn-hover-border: #bbb;
      --modal-bg: #ffffff;
      --accent: #2563eb;
      --focus-color: rgba(37,99,235,0.1);
      --dim-color: #bbb;
      --gradient-fade: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      transition: background 0.25s, color 0.25s;
    }

    /* ── 控制栏 ── */
    #controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      transition: transform 0.3s ease, opacity 0.3s ease, background 0.25s;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .ctrl-group label { white-space: nowrap; }

    input[type=range] {
      -webkit-appearance: none;
      width: 90px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .val-display {
      color: var(--text);
      min-width: 28px;
      text-align: right;
    }

    .btn-group { display: flex; gap: 6px; }

    button {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover { background: var(--btn-hover); border-color: var(--btn-hover-border); }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    #playBtn {
      padding: 5px 20px;
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    #playBtn:hover  { background: var(--accent); color: #fff; }
    #playBtn.playing { background: var(--accent); color: #fff; }

    .sep { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

    /* ── 语言选择 ── */
    #langSelect {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, color 0.25s;
    }
    #langSelect:hover { border-color: var(--btn-hover-border); }
    body.light #langSelect { background: var(--surface); }

    /* ── 舞台 ── */
    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    #focus-band {
      position: absolute; left: 0; right: 0;
      top: 50%; transform: translateY(-50%);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #focus-band.hidden { opacity: 0; }
    #focus-band-inner {
      margin: 0 auto;
      height: var(--band-h, 80px);
      background: var(--focus-color);
      border-top: 1px solid rgba(79,142,247,0.3);
      border-bottom: 1px solid rgba(79,142,247,0.3);
    }

    #stage::before, #stage::after {
      content: '';
      position: absolute; left: 0; right: 0;
      height: 120px;
      z-index: 5; pointer-events: none;
    }
    #stage::before { top: 0;    background: linear-gradient(to bottom, var(--gradient-fade), transparent); }
    #stage::after  { bottom: 0; background: linear-gradient(to top,   var(--gradient-fade), transparent); }

    #scroller {
      position: absolute; left: 0; right: 0; top: 0;
      padding: 55vh 10% 55vh;
      will-change: transform;
    }
    #scroller.mirror { transform: scaleX(-1); }

    #script-text {
      font-size: 36px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      text-align: center;
      outline: none;
      transition: color 0.25s;
    }
    #script-text.dim { color: var(--dim-color); }
    #script-text:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      pointer-events: none;
    }

    /* ── 编辑模态 ── */
    #editor-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #editor-overlay.open { display: flex; }

    #editor-modal {
      background: var(--modal-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: min(680px, 90vw);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #editor-modal h3 { font-size: 1rem; color: var(--muted); font-weight: 400; }

    #editor-ta {
      width: 100%; height: 300px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.7;
      padding: 14px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      transition: background 0.25s, color 0.25s;
    }
    #editor-ta:focus { border-color: var(--accent); }
    .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }

    /* ── 快捷键提示 ── */
    #shortcuts {
      position: fixed;
      bottom: 14px; right: 16px;
      font-size: 0.72rem;
      color: var(--hint);
      line-height: 1.9;
      pointer-events: none;
      z-index: 20;
      text-align: right;
      transition: opacity 0.3s, color 0.25s;
    }

    /* ── 无干扰模式 ── */
    body.zen #controls {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    body.zen #shortcuts { opacity: 0; }
    body.zen #mobile-hint { opacity: 0; }

    /* 顶部悬停唤出区（PC hover 用） */
    #zen-trigger {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 8px;
      z-index: 150;
      display: none;
    }
    body.zen #zen-trigger { display: block; }

    /* 无干扰悬浮按钮 */
    #zen-fab {
      position: fixed;
      top: 14px; right: 16px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(30,30,30,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      font-size: 1rem;
      display: none;
      align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 160;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.2s, transform 0.2s;
      padding: 0;
    }
    body.zen #zen-fab { display: flex; }
    body.zen.controls-peeking #zen-fab { transform: translateY(calc(var(--controls-h, 48px) + 4px)); }
    body.light #zen-fab {
      background: rgba(240,240,240,0.7);
      border-color: rgba(0,0,0,0.1);
      color: rgba(0,0,0,0.6);
    }
    #zen-fab:hover { background: rgba(60,60,60,0.75); }
    body.light #zen-fab:hover { background: rgba(210,210,210,0.85); }

    /* 无干扰提示（仅 PC 显示） */
    #zen-hint {
      position: fixed;
      top: 16px; left: 50%; transform: translateX(-50%);
      padding: 5px 16px;
      background: rgba(0,0,0,0.45);
      color: rgba(255,255,255,0.45);
      border-radius: 20px;
      font-size: 0.72rem;
      pointer-events: none;
      z-index: 155;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    body.light #zen-hint { background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.35); }
    body.zen #zen-hint { opacity: 1; }
    @media (pointer: coarse) { #zen-hint { display: none; } }

    /* ── 速度微调按钮 ── */
    .speed-adj {
      display: none;
      width: 28px; height: 28px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.1rem;
      line-height: 1;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── 移动端操作提示 ── */
    #mobile-hint {
      display: none;
      position: fixed;
      bottom: 14px; right: 16px;
      font-size: 0.72rem;
      color: var(--hint);
      line-height: 1.9;
      pointer-events: none;
      z-index: 20;
      text-align: right;
      transition: opacity 0.3s, color 0.25s;
    }
    body.zen #mobile-hint { opacity: 0; }

    /* zen-hint 内容按设备显示 */
    .desktop-only { display: inline; }
    .mobile-only  { display: none; }

    /* ── pointer: coarse = 触摸设备 ── */
    @media (pointer: coarse) {
      #zen-trigger  { height: 56px; }
      #shortcuts    { display: none; }
      #mobile-hint  { display: block; }
      .speed-adj    { display: flex; }
      .desktop-only { display: none; }
      .mobile-only  { display: inline; }
      /* 滑块加大触摸区 */
      input[type=range] { width: 80px; height: 20px; }
      input[type=range]::-webkit-slider-thumb { width: 20px; height: 20px; }
    }
  </style>
</head>

      keywords: 'телесуфлёр,онлайн телесуфлёр,суфлёр для выступлений,зеркальный суфлёр,teleprompter',
      featureList: ['Зеркальное отражение','Регулировка скорости прокрутки','Изменение размера шрифта','Подсветка полосы фокуса','Светлая/тёмная тема','Полноэкранный режим','Режим без отвлечений','Поддержка мобильных устройств'],

      cancel: 'Отмена', save: 'Сохранить',
      shortcutsHtml: 'Space старт/пауза<br>↑↓ скорость · M зеркало · R сброс<br>T тема · F экран · Tab фокус',
      mobileHintHtml: 'Нажмите для паузы<br>Кнопка справа вверху — открыть меню',
      zenHint: 'Tab · выйти из фокус-режима', fabTitle: 'Открыть панель',
      sample: `Добрый вечер, дорогие друзья.\n\nСегодня я хочу поговорить о смелости\nсделать первый шаг.\n\nКаждое путешествие начинается\nс одного маленького решения.\nНе нужно быть идеальным —\nнужно просто начать.\n\nКак гласит древняя мудрость:\nпуть в тысячу ли\nначинается с первого шага.\n\nСпасибо за внимание.`,
    },
  };

  let currentLang = 'zh-CN';
  function t(key) { return LANGS[currentLang][key]; }

  function applyLang(code) {
    currentLang = code;
    const lng = LANGS[code];
    document.documentElement.lang = lng.htmlLang;
    document.title = lng.pageTitle;

    // ── SEO meta 同步 ──
    document.getElementById('meta-desc').content  = lng.description;
    document.getElementById('meta-kw').content    = lng.keywords;
    document.getElementById('og-title').content   = lng.pageTitle;
    document.getElementById('og-desc').content    = lng.description;
    document.getElementById('og-locale').content  = lng.ogLocale;
    document.getElementById('tw-title').content   = lng.pageTitle;
    document.getElementById('tw-desc').content    = lng.description;
    document.getElementById('json-ld').textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'WebApplication',
      name: lng.pageTitle.split(' —')[0].split(' -')[0].trim(),
      description: lng.description,
      applicationCategory: 'UtilitiesApplication',
      operatingSystem: 'Web',
      offers: { '@type': 'Offer', price: '0', priceCurrency: 'CNY' },
      featureList: lng.featureList,
      inLanguage: lng.htmlLang,
    });
    // URL 同步（不刷新页面）
    history.replaceState(null, '', '?lang=' + code);

    // data-i18n 静态元素（不含状态驱动的按钮）
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (lng[key] !== undefined) el.textContent = lng[key];
    });

    // 状态驱动按钮
    playBtn.textContent      = playing ? lng.pause : lng.play;
    themeBtn.textContent     = body.classList.contains('light') ? lng.dark : lng.light;
    fullscreenBtn.textContent = document.fullscreenElement ? lng.exitFullscreen : lng.fullscreen;

    // innerHTML 提示区
    document.getElementById('shortcuts').innerHTML    = lng.shortcutsHtml;
    document.getElementById('mobile-hint').innerHTML  = lng.mobileHintHtml;
    document.querySelector('#zen-hint .desktop-only').textContent = lng.zenHint;

    // 属性
    editorTa.placeholder           = lng.taPlaceholder;
    scriptText.dataset.placeholder = lng.scriptPlaceholder;
    zenFab.title                   = lng.fabTitle;

    // 语言选择器同步
    langSelect.value = code;

    localStorage.setItem('ticiqi-lang', code);
  }

  // ── 状态 ──
  let playing = false;
  let scrollY = 0;
  let rafId = null;
  let lastTime = null;

  // ── DOM ──
  const body          = document.body;
  const scroller      = document.getElementById('scroller');
  const scriptText    = document.getElementById('script-text');
  const stage         = document.getElementById('stage');
  const playBtn       = document.getElementById('playBtn');
  const speedRange    = document.getElementById('speedRange');
  const speedVal      = document.getElementById('speedVal');
  const fontRange     = document.getElementById('fontRange');
  const fontVal       = document.getElementById('fontVal');
  const focusRange    = document.getElementById('focusRange');
  const focusVal      = document.getElementById('focusVal');
  const mirrorBtn     = document.getElementById('mirrorBtn');
  const focusBtn      = document.getElementById('focusBtn');
  const dimBtn        = document.getElementById('dimBtn');
  const focusBand     = document.getElementById('focus-band');
  const themeBtn      = document.getElementById('themeBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const zenBtn        = document.getElementById('zenBtn');
  const editBtn       = document.getElementById('editBtn');
  const resetBtn      = document.getElementById('resetBtn');
  const overlay       = document.getElementById('editor-overlay');
  const editorTa      = document.getElementById('editor-ta');
  const cancelBtn     = document.getElementById('cancelBtn');
  const saveBtn       = document.getElementById('saveBtn');
  const zenTrigger    = document.getElementById('zen-trigger');
  const controls      = document.getElementById('controls');
  const zenFab        = document.getElementById('zen-fab');
  const langSelect    = document.getElementById('langSelect');

  // ── 滚动 ──
  function getSpeed() {
    return 20 * Math.pow(parseFloat(speedRange.value), 1.6);
  }

  function applyTransform() {
    const mirror = scroller.classList.contains('mirror');
    scroller.style.transform = mirror
      ? `scaleX(-1) translateY(${-scrollY}px)`
      : `translateY(${-scrollY}px)`;
  }

  function tick(ts) {
    if (!playing) return;
    if (lastTime == null) lastTime = ts;
    const dt = (ts - lastTime) / 1000;
    lastTime = ts;
    const maxScroll = scroller.scrollHeight - stage.clientHeight;
    scrollY = Math.min(scrollY + getSpeed() * dt, maxScroll);
    applyTransform();
    if (scrollY >= maxScroll) { stopPlay(); return; }
    rafId = requestAnimationFrame(tick);
  }

  function stopPlay() {
    playing = false;
    playBtn.textContent = t('play');
    playBtn.classList.remove('playing');
    cancelAnimationFrame(rafId);
    lastTime = null;
  }

  function togglePlay() {
    playing = !playing;
    if (playing) {
      playBtn.textContent = t('pause');
      playBtn.classList.add('playing');
      lastTime = null;
      rafId = requestAnimationFrame(tick);
    } else {
      stopPlay();
    }
  }

  playBtn.addEventListener('click', togglePlay);

  // ── 速度 / 字号 / 聚焦 ──
  speedRange.addEventListener('input', () => { speedVal.textContent = speedRange.value; });

  function adjustSpeed(delta) {
    speedRange.value = Math.min(10, Math.max(1, parseFloat(speedRange.value) + delta));
    speedVal.textContent = speedRange.value;
  }
  document.getElementById('speedDown').addEventListener('click', () => adjustSpeed(-0.5));
  document.getElementById('speedUp').addEventListener('click',   () => adjustSpeed(+0.5));

  fontRange.addEventListener('input', () => {
    const v = fontRange.value;
    fontVal.textContent = v;
    scriptText.style.fontSize = v + 'px';
    const auto = Math.min(200, Math.max(40, Math.round(parseFloat(v) * 1.7 * 1.2)));
    focusRange.value = auto;
    focusVal.textContent = auto;
    document.documentElement.style.setProperty('--band-h', auto + 'px');
  });

  focusRange.addEventListener('input', () => {
    focusVal.textContent = focusRange.value;
    document.documentElement.style.setProperty('--band-h', focusRange.value + 'px');
  });

  // ── 开关 ──
  mirrorBtn.addEventListener('click', () => {
    scroller.classList.toggle('mirror');
    mirrorBtn.classList.toggle('active');
    applyTransform();
  });

  focusBtn.addEventListener('click', () => {
    focusBtn.classList.toggle('active');
    focusBand.classList.toggle('hidden', !focusBtn.classList.contains('active'));
  });

  dimBtn.addEventListener('click', () => {
    dimBtn.classList.toggle('active');
    scriptText.classList.toggle('dim', dimBtn.classList.contains('active'));
  });

  resetBtn.addEventListener('click', () => {
    stopPlay();
    scrollY = 0;
    applyTransform();
  });

  // ── 主题切换 ──
  function toggleTheme() {
    body.classList.toggle('light');
    themeBtn.textContent = body.classList.contains('light') ? t('dark') : t('light');
    themeBtn.classList.toggle('active', body.classList.contains('light'));
  }
  themeBtn.addEventListener('click', toggleTheme);

  // ── 全屏 ──
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);

  document.addEventListener('fullscreenchange', () => {
    const isFull = !!document.fullscreenElement;
    fullscreenBtn.textContent = isFull ? t('exitFullscreen') : t('fullscreen');
    fullscreenBtn.classList.toggle('active', isFull);
  });

  // ── 无干扰模式 ──
  let zenRevealTimer = null;

  function toggleZen() {
    body.classList.toggle('zen');
    zenBtn.classList.toggle('active', body.classList.contains('zen'));
    if (!body.classList.contains('zen')) zenHideControls();
  }
  zenBtn.addEventListener('click', toggleZen);

  function zenShowControls() {
    if (!body.classList.contains('zen')) return;
    controls.style.transform = 'translateY(0)';
    controls.style.opacity = '1';
    controls.style.pointerEvents = 'auto';
    body.classList.add('controls-peeking');
    document.documentElement.style.setProperty('--controls-h', controls.offsetHeight + 'px');
    clearTimeout(zenRevealTimer);
  }

  function zenHideControls() {
    controls.style.transform = '';
    controls.style.opacity = '';
    controls.style.pointerEvents = '';
    body.classList.remove('controls-peeking');
  }

  function zenStartAutoHide(ms) {
    clearTimeout(zenRevealTimer);
    zenRevealTimer = setTimeout(() => {
      if (body.classList.contains('zen')) zenHideControls();
    }, ms);
  }

  zenFab.addEventListener('click', () => {
    if (body.classList.contains('controls-peeking')) {
      zenHideControls();
    } else {
      zenShowControls();
      zenStartAutoHide(4000);
    }
  });

  zenTrigger.addEventListener('mouseenter', () => {
    zenShowControls();
    clearTimeout(zenRevealTimer);
  });
  controls.addEventListener('mouseleave', () => {
    if (!body.classList.contains('zen')) return;
    zenStartAutoHide(600);
  });
  controls.addEventListener('mouseenter', () => {
    if (!body.classList.contains('zen')) return;
    clearTimeout(zenRevealTimer);
  });

  // ── 编辑文稿 ──
  editBtn.addEventListener('click', () => {
    editorTa.value = scriptText.innerText;
    overlay.classList.add('open');
    editorTa.focus();
  });
  cancelBtn.addEventListener('click', () => overlay.classList.remove('open'));
  saveBtn.addEventListener('click', () => {
    scriptText.textContent = editorTa.value;
    overlay.classList.remove('open');
    scrollY = 0;
    applyTransform();
  });
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  // ── 语言切换 ──
  langSelect.addEventListener('change', () => applyLang(langSelect.value));

  // ── 键盘 ──
  document.addEventListener('keydown', e => {
    if (overlay.classList.contains('open')) return;
    switch (e.code) {
      case 'Space':     e.preventDefault(); togglePlay(); break;
      case 'ArrowUp':   e.preventDefault(); adjustSpeed(+0.5); break;
      case 'ArrowDown': e.preventDefault(); adjustSpeed(-0.5); break;
      case 'KeyM':      mirrorBtn.click(); break;
      case 'KeyR':      resetBtn.click(); break;
      case 'KeyT':      toggleTheme(); break;
      case 'KeyF':      toggleFullscreen(); break;
      case 'Tab':       e.preventDefault(); toggleZen(); break;
    }
  });

  // ── 拖动 + 移动端点按 ──
  let dragStartY = null, dragStartScroll = 0;
  let tapStartY = null, tapStartX = null, tapStartTime = null;

  stage.addEventListener('mousedown', e => {
    dragStartY = e.clientY;
    dragStartScroll = scrollY;
  });
  document.addEventListener('mousemove', e => {
    if (dragStartY == null) return;
    const max = scroller.scrollHeight - stage.clientHeight;
    scrollY = Math.max(0, Math.min(max, dragStartScroll + (dragStartY - e.clientY)));
    applyTransform();
  });
  document.addEventListener('mouseup', () => { dragStartY = null; });

  stage.addEventListener('touchstart', e => {
    const t = e.touches[0];
    dragStartY = t.clientY;
    dragStartScroll = scrollY;
    tapStartY = t.clientY;
    tapStartX = t.clientX;
    tapStartTime = performance.now();
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (dragStartY == null) return;
    const max = scroller.scrollHeight - stage.clientHeight;
    scrollY = Math.max(0, Math.min(max, dragStartScroll + (dragStartY - e.touches[0].clientY)));
    applyTransform();
  }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (tapStartY == null) return;
    const touch = e.changedTouches[0];
    const dy = Math.abs(touch.clientY - tapStartY);
    const dx = Math.abs(touch.clientX - tapStartX);
    const dt = performance.now() - tapStartTime;
    if (dy < 12 && dx < 12 && dt < 350) togglePlay();
  });
  document.addEventListener('touchend', () => {
    dragStartY = null;
    tapStartY = null; tapStartX = null; tapStartTime = null;
  });

  // ── 初始化语言 ──
  (function initLang() {
    const urlParam = new URLSearchParams(location.search).get('lang');
    const saved    = localStorage.getItem('ticiqi-lang');
    const browser  = (navigator.language || '').toLowerCase();
    const detected = urlParam || saved ||
      (browser.startsWith('zh-tw') || browser.startsWith('zh-hk') ? 'zh-TW'
      : browser.startsWith('zh') ? 'zh-CN'
      : browser.startsWith('ru')  ? 'ru'
      : 'zh-CN');
    const lang = LANGS[detected] ? detected : 'zh-CN';
    applyLang(lang);
    scriptText.textContent = LANGS[lang].sample;
  })();
</script>
